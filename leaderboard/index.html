<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/core.css?v=4">
<style>
  /* Display board: big type, generous spacing, meant for a projector or TV. */
  body{padding:0}
  .display{max-width:1040px;margin:0 auto;padding:clamp(18px,3vw,40px) clamp(14px,3vw,32px) 60px}

  .head{text-align:center;margin-bottom:clamp(18px,3vw,30px)}
  .head h1{font-size:clamp(2rem,5.2vw,3.6rem);line-height:1.05}
  .qrbtn{
    margin-top:12px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    background:var(--card);color:var(--accent);border:1px solid var(--line);border-radius:999px;
    padding:8px 18px;box-shadow:var(--shadow-sm)
  }
  .qrbtn:hover{border-color:var(--accent)}

  /* ------------------------------ QR popup ----------------------------- */
  .qrpop{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(36,26,18,.6);backdrop-filter:blur(4px)
  }
  .qrpop[hidden]{display:none}
  .qrcard{
    background:var(--card);border-radius:24px;box-shadow:var(--shadow);text-align:center;
    padding:clamp(20px,3vw,32px);width:min(92vw,560px);
    border-top:8px solid var(--accent)
  }
  .qrcard h2{font-size:clamp(1.3rem,3vw,1.9rem);margin-bottom:4px}
  .qrlede{color:var(--ink-soft);margin:0 0 16px;font-weight:600}
  .qrbox{
    width:min(70vw,60vh,420px);aspect-ratio:1/1;margin:0 auto;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px
  }
  .qrbox svg{width:100%;height:100%;display:block}
  .qrurl{margin:14px 0 16px;font-weight:700;color:var(--accent);overflow-wrap:anywhere;font-size:clamp(.95rem,2vw,1.2rem)}

  /* ------------------------------ podium ------------------------------ */
  .podium{
    display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:clamp(10px,2vw,18px);
    align-items:end;margin-bottom:clamp(18px,3vw,28px)
  }
  .step{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);text-align:center;padding:clamp(16px,2.4vw,26px) 14px;
    position:relative;overflow:hidden;min-height:150px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  }
  .step::before{
    content:'';position:absolute;inset:0 0 auto 0;height:7px;background:var(--medal)
  }
  .step.first{--medal:linear-gradient(90deg,#E3A81F,#F6D46A);min-height:190px;border-color:#EAC968}
  .step.second{--medal:linear-gradient(90deg,#9AA3AD,#D2D8DE)}
  .step.third{--medal:linear-gradient(90deg,#B4713E,#DCA277)}
  .step .medal{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1}
  /* core.css truncates .board .who for the in-game list; here names get the full width. */
  .step .who{
    font-family:'Yatra One',serif;font-size:clamp(1.25rem,2.8vw,1.9rem);line-height:1.15;
    max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere
  }
  .step.first .who{font-size:clamp(1.5rem,3.4vw,2.3rem)}
  .step .pts{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:800;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
  .step .pts small{font-size:.5em;font-weight:700;color:var(--ink-soft)}
  .step .time{color:var(--ink-soft);font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums}
  .step.empty{opacity:.45;box-shadow:none}
  .step.empty .who{color:var(--ink-soft);font-family:inherit;font-weight:600;font-size:1rem}

  /* ------------------------------- list ------------------------------- */
  .list{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow-sm);overflow:hidden
  }
  .row{
    display:grid;grid-template-columns:3.2rem 1fr auto auto;align-items:center;
    gap:clamp(10px,2vw,22px);padding:clamp(10px,1.6vw,15px) clamp(14px,2.6vw,28px);
    border-bottom:1px solid var(--line);font-size:clamp(1.05rem,2.1vw,1.45rem)
  }
  .row:last-child{border-bottom:none}
  .row:nth-child(even){background:rgba(244,231,205,.35)}
  .row .rank{
    width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;
    background:var(--accent-wash);color:var(--accent);font-weight:800;font-size:.85em
  }
  .row .name{font-weight:700;overflow-wrap:anywhere}
  .row .score{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .score small{font-weight:600;color:var(--ink-soft);font-size:.7em}
  .row .time{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:600;font-size:.85em;min-width:3.6em;text-align:right}
  .row.head{background:transparent;color:var(--ink-soft);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:12px;padding-bottom:12px}
  .row.head .rank{background:none}
  .row.hi{animation:pop .9s ease-out}
  @keyframes pop{0%{background:var(--accent-wash)}100%{background:transparent}}

  .none{padding:48px 20px;text-align:center;color:var(--ink-soft);font-size:1.2rem}
  .none b{display:block;font-family:'Yatra One',serif;font-size:1.6rem;color:var(--ink);margin-bottom:6px}

  /* ---------------------------- skeleton state -------------------------- */
  .skel{position:relative;overflow:hidden;display:inline-block;background:var(--accent-wash);border-radius:6px}
  .skel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:shimmer 1.3s ease-in-out infinite
  }
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .step.skeleton{box-shadow:none}
  .step.skeleton .skel.medal{width:1.6em;height:1.6em;border-radius:50%}
  .step.skeleton .skel.who{width:70%;height:1.1em;margin:2px auto}
  .step.skeleton .skel.pts{width:50%;height:1.4em;margin:4px auto 0}
  .row.skeleton .skel.name{width:min(220px,60%);height:1em}
  .row.skeleton .skel.score{width:60px;height:1em;margin-left:auto}
  @media(prefers-reduced-motion: reduce){.skel::after{animation:none}}

  /* ------------------------------ picker ------------------------------ */
  .picker{max-width:720px;margin:0 auto;padding:clamp(24px,5vw,60px) 16px}
  .picker h1{font-size:clamp(2rem,6vw,3rem);text-align:center;margin-bottom:8px}
  .picker p{text-align:center;color:var(--ink-soft);margin-bottom:26px}
  .picker .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .picker a{
    display:block;padding:18px 18px;background:var(--card);border:1px solid var(--line);
    border-left:8px solid var(--tint);border-radius:16px;text-decoration:none;color:var(--ink);
    font-family:'Yatra One',serif;font-size:1.1rem;box-shadow:var(--shadow-sm)
  }
  .picker a:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

  .foot{
    margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px;
    text-align:center;color:var(--ink-soft);font-size:.82rem;opacity:.75
  }
  .foot a{color:var(--ink-soft)}
  .foot .kbd{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:700;font-size:.75rem}
  .meta{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:600}
  .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
  .meta .dot.off{background:var(--bad)}
  .meta .dot.busy{background:var(--gold)}
  .meta button{
    font:inherit;font-size:.78rem;font-weight:700;color:var(--ink-soft);cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-left:4px
  }
  .meta button:hover{border-color:var(--ink-soft);color:var(--ink)}
  .meta button:disabled{opacity:.5;cursor:default}

  .site{
    margin:30px 0 0;text-align:center;font-family:'Yatra One',serif;
    font-size:clamp(1.05rem,2.2vw,1.4rem);color:var(--accent);
    white-space:normal;overflow:visible;line-height:1.3
  }
  .site::before{content:'✦ ';color:var(--gold)}
  .site::after{content:' ✦';color:var(--gold)}

  body.tv .foot,body.tv .meta .hint{display:none}
  body.tv .display{max-width:1180px}

  @media(max-width:640px){
    .podium{grid-template-columns:1fr 1fr 1fr}
    .step{min-height:120px;padding:14px 8px}
    .step.first{min-height:150px}
    .row{grid-template-columns:2.4rem 1fr auto;gap:10px}
    .row .time{display:none}
    .row .rank{width:2.1rem;height:2.1rem}
  }
</style>
</head>
<body data-accent="saffron">

<main id="app" class="display" aria-live="polite"></main>

<script src="/assets/site.js?v=3"></script>
<script src="/assets/qrcode.js"></script>
<script>
(function () {
  const GAMES = [
    { slug: 'pic-values',  title: 'One Pic, Many Values',        accent: 'saffron',  tint: '#D75B16' },
    { slug: 'matching',    title: 'Shrines and Locations',       accent: 'peacock',  tint: '#0E6D75' },
    { slug: 'unscramble',  title: 'Unscramble the Hidden Word',  accent: 'indigo',   tint: '#4B3B8F' },
    { slug: 'who-said-it', title: 'Who Said It?',                accent: 'rose',     tint: '#B23A6B' },
    { slug: 'guess-who',   title: 'Guess Who?',                  accent: 'tulsi',    tint: '#1F6F4A' },
    { slug: 'count-faces', title: 'Count the Happy Faces',       accent: 'marigold', tint: '#B97A06' },
    { slug: 'identify',    title: 'Identify the Character',      accent: 'plum',     tint: '#6E2E6B' }
  ];
  const SITE_NAME = (window.SITE && (window.SITE.footer || window.SITE.name)) || 'Sri Sathya Sai Balvikas Gurus Training';
  const REFRESH_MS = 20000;
  const LIMIT = 50;

  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const game = GAMES.find(g => g.slug === params.get('game'));

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const fmtTime = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtClock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  /* ---------------------------- game picker ---------------------------- */
  if (!game) {
    document.title = 'Leaderboards';
    app.className = 'picker';
    app.innerHTML =
      '<h1>Leaderboards</h1>' +
      '<p>Pick a game to put its board on the big screen.</p>' +
      '<div class="grid">' + GAMES.map(g =>
        '<a href="/leaderboard?game=' + g.slug + '" style="--tint:' + g.tint + '">' + esc(g.title) + '</a>'
      ).join('') + '</div>' +
      '<p class="site">' + esc(SITE_NAME) + '</p>';
    return;
  }

  /* ---------------------------- display board -------------------------- */
  document.body.dataset.accent = game.accent;
  document.title = game.title + ' · Leaderboard';
  if (params.has('tv')) document.body.classList.add('tv');

  let lastKey = '';       // signature of the last render, to spot new entries
  let timer = null;

  app.innerHTML =
    '<header class="head"><h1>' + esc(game.title) + '</h1>' +
      '<button class="qrbtn" id="qrBtn" type="button">▦ Scan to play</button></header>' +
    '<div class="qrpop" id="qrPop" hidden>' +
      '<div class="qrcard" role="dialog" aria-modal="true" aria-label="QR code to play">' +
        '<h2>' + esc(game.title) + '</h2>' +
        '<p class="qrlede">Scan with your phone camera to play</p>' +
        '<div class="qrbox" id="qrBox"></div>' +
        '<p class="qrurl" id="qrUrl"></p>' +
        '<button class="btn small" id="qrClose" type="button">Close</button>' +
      '</div>' +
    '</div>' +
    '<section class="podium" id="podium"></section>' +
    '<section class="list" id="list"></section>' +
    '<p class="site">' + esc(SITE_NAME) + '</p>' +
    '<footer class="foot">' +
      '<span class="meta"><span class="dot busy" id="dot"></span><span id="status">Loading…</span>' +
        '<button id="refreshBtn" type="button" title="Refresh now">↻ Refresh</button></span>' +
      '<span>Points first; ties go to the faster finish. Checks for new scores every ' + (REFRESH_MS / 1000) + ' seconds.</span>' +
      '<span><a href="/leaderboard">All boards</a> &nbsp;·&nbsp; <a href="/' + game.slug + '">Play</a> &nbsp;·&nbsp; <span class="kbd">F</span> full screen &nbsp;·&nbsp; <span class="kbd">Q</span> QR code</span>' +
    '</footer>';

  const podium = document.getElementById('podium');
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', load);

  /* ------------------------------ QR popup ----------------------------- */
  const qrPop = document.getElementById('qrPop');
  const playUrl = location.origin + '/' + game.slug;
  let qrDrawn = false;
  function openQr() {
    if (!qrDrawn && window.qrcode) {
      const qr = window.qrcode(0, 'M');
      qr.addData(playUrl);
      qr.make();
      document.getElementById('qrBox').innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
      document.getElementById('qrUrl').textContent = playUrl.replace(/^https?:\/\//, '');
      qrDrawn = true;
    }
    qrPop.hidden = false;
  }
  function closeQr() { qrPop.hidden = true; }
  document.getElementById('qrBtn').addEventListener('click', openQr);
  document.getElementById('qrClose').addEventListener('click', closeQr);
  qrPop.addEventListener('click', ev => { if (ev.target === qrPop) closeQr(); });

  const MEDALS = ['🥇', '🥈', '🥉'];
  const STEPS = ['first', 'second', 'third'];

  function skeletonStep(i) {
    return '<div class="step ' + STEPS[i] + ' skeleton">' +
      '<div class="medal skel">&nbsp;</div>' +
      '<div class="who skel">&nbsp;</div>' +
      '<div class="pts skel">&nbsp;</div>' +
    '</div>';
  }

  function skeletonRow(rank) {
    return '<div class="row skeleton">' +
      '<span class="rank">' + rank + '</span>' +
      '<span class="name skel">&nbsp;</span>' +
      '<span class="score skel">&nbsp;</span>' +
      '<span class="time"></span>' +
    '</div>';
  }

  function renderSkeleton() {
    podium.innerHTML = skeletonStep(1) + skeletonStep(0) + skeletonStep(2);
    list.innerHTML = Array.from({ length: 5 }, (_, i) => skeletonRow(i + 4)).join('');
  }

  function step(r, i) {
    if (!r) return '<div class="step ' + STEPS[i] + ' empty"><div class="medal">' + MEDALS[i] + '</div><div class="who">Waiting for a player</div></div>';
    return '<div class="step ' + STEPS[i] + '">' +
      '<div class="medal">' + MEDALS[i] + '</div>' +
      '<div class="who">' + esc(r.player) + '</div>' +
      '<div class="pts">' + r.score + '<small> / ' + r.maxScore + '</small></div>' +
      '<div class="time">⏱ ' + fmtTime(r.durationMs) + '</div>' +
    '</div>';
  }

  function setStatus(data, note) {
    status.textContent = data.plays + (data.plays === 1 ? ' play' : ' plays') + ' · ' + note + ' ' + fmtClock(new Date());
    dot.className = 'dot';
  }

  function render(data) {
    const rows = data.rows;
    const key = data.plays + '#' + rows.map(r => r.player + '|' + r.score + '|' + r.durationMs).join(';');
    const first = lastKey === '';
    if (key === lastKey) { setStatus(data, 'checked'); return; }   // nothing new: leave the screen alone
    const changed = !first;
    lastKey = key;

    // Podium order on screen: 2nd, 1st, 3rd
    podium.innerHTML = step(rows[1], 1) + step(rows[0], 0) + step(rows[2], 2);

    const rest = rows.slice(3);
    if (!rows.length) {
      list.innerHTML = '<div class="none"><b>No scores yet</b>Be the first to play ' + esc(game.title) + '.</div>';
    } else if (!rest.length) {
      list.innerHTML = '<div class="none">Only ' + rows.length + (rows.length === 1 ? ' player' : ' players') + ' so far — room on the board!</div>';
    } else {
      list.innerHTML =
        '<div class="row head"><span class="rank">#</span><span>Player</span><span>Score</span><span class="time">Time</span></div>' +
        rest.map((r, i) =>
          '<div class="row' + (changed ? ' hi' : '') + '">' +
            '<span class="rank">' + (i + 4) + '</span>' +
            '<span class="name">' + esc(r.player) + '</span>' +
            '<span class="score">' + r.score + '<small> / ' + r.maxScore + '</small></span>' +
            '<span class="time">' + fmtTime(r.durationMs) + '</span>' +
          '</div>'
        ).join('');
    }

    setStatus(data, first ? 'loaded' : 'updated');
  }

  async function load() {
    dot.className = 'dot busy';
    refreshBtn.disabled = true;
    try {
      const res = await fetch('/api/leaderboard?game=' + game.slug + '&limit=' + LIMIT, { cache: 'no-store' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Could not load.');
      render(data);
    } catch (e) {
      dot.className = 'dot off';
      status.textContent = 'Could not refresh — retrying';
    }
    refreshBtn.disabled = false;
    clearTimeout(timer);
    if (!document.hidden) timer = setTimeout(load, REFRESH_MS);
  }

  document.addEventListener('keydown', ev => {
    if (ev.key === 'f' || ev.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else if (ev.key === 'r' || ev.key === 'R') load();
    else if (ev.key === 'q' || ev.key === 'Q') { qrPop.hidden ? openQr() : closeQr(); }
    else if (ev.key === 'Escape') closeQr();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else load();
  });

  renderSkeleton();
  load();
})();
</script>
</body>
</html>
