<!DOCTYPE html>
<html lang="en" class="bv-loading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identify the Character</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/core.css?v=4">
<style>
  .mist{
    position:relative;width:min(340px,86vw);aspect-ratio:3/4;margin:0 auto 14px;
    border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:var(--paper-deep);box-shadow:var(--shadow);
  }
  .mist img{
    width:100%;height:100%;object-fit:cover;
    filter:blur(20px) saturate(.6);transform:scale(1.14);
    transition:filter .25s linear,transform .25s linear;
  }
  .mist::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 44px rgba(110,46,107,.28);
  }
  .worthbar{
    display:flex;align-items:baseline;justify-content:center;gap:9px;margin-bottom:12px;
  }
  .worthbar b{font-family:'Yatra One',serif;font-size:2rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .worthbar span{font-size:.82rem;color:var(--ink-soft)}
  .opts{display:grid;gap:9px;grid-template-columns:1fr 1fr}
  @media(min-width:560px){.opts{grid-template-columns:1fr 1fr 1fr}}
  .opt{
    font:inherit;font-weight:700;font-size:.96rem;cursor:pointer;
    padding:14px 8px;border-radius:12px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);
  }
  .opt:hover{border-color:var(--accent)}
  .opt.right{border-color:var(--good);background:#E8F5EE;color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:#FBE9EB;color:var(--bad)}
  .opt:disabled{cursor:default;opacity:.55}
  .opt.right:disabled,.opt.wrong:disabled{opacity:1}
  .after{
    margin-top:14px;background:var(--accent-wash);border-radius:12px;
    padding:13px 15px;font-size:.93rem;line-height:1.5;text-align:center;
  }
  .verdict{text-align:center;font-family:'Yatra One',serif;font-size:1.35rem;margin:14px 0 2px}
</style>
</head>
<body data-accent="plum">
<div class="wrap">

  <section id="start" class="panel center" style="margin-top:6px">
    <span class="tag">Game 7</span>
    <h1 style="font-size:1.8rem;margin:12px 0 8px">Identify the Character</h1>
    <p class="lede" style="margin:0 auto 6px">A picture sits deep in mist and clears a little every second. The longer you wait to be sure, the less it is worth.</p>
    <p class="hint">300 points while it is still a blur, sliding down to 100 once it is fully clear. One guess each.</p>
    <div class="btnrow"><button class="btn" id="startBtn">Start</button></div>
  </section>

  <section id="play" hidden>
    <div class="rail" id="rail"></div>
    <div class="worthbar"><b id="worth">300</b><span>points if you answer now</span></div>
    <div class="mist" id="mist"><img id="pic" alt="A picture clearing from mist"></div>
    <div class="opts" id="opts"></div>
    <div class="verdict" id="verdict" hidden></div>
    <div class="after" id="after" hidden></div>
    <div class="btnrow"><button class="btn" id="nextBtn" hidden>Next picture</button></div>
  </section>

</div>
<footer class="foot" data-site="footer"></footer>

<script src="/assets/site.js?v=3"></script>
<script src="/assets/core.js?v=4"></script>
<script src="/identify/data.js"></script>
<script src="/identify/game.js"></script>
</body>
</html>
